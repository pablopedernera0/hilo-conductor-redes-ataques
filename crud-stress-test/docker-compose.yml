services:

  mysql:
    image: mysql:latest
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmysecretpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: "no"
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: mysecretpassword
    depends_on:
      mysql:
        condition: service_healthy

  # Contenedor con Apache Bench (ab) -- así el alumno no necesita instalarlo en su propia
  # máquina (en Windows, sin WSL, no hay forma directa de instalarlo). Se queda corriendo en
  # espera ("sleep infinity"); los pasos de la práctica le mandan comandos con
  # "docker compose exec abtool ab ...", apuntando a host.docker.internal (la app corre suelta
  # en el host, no en un contenedor -- ver README de esta carpeta).
  abtool:
    build: ./abtool
    extra_hosts:
      - "host.docker.internal:host-gateway"
