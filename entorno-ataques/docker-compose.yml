services:

  mysql:
    image: mysql:latest
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: mysecretpassword
      MYSQL_DATABASE: alumnos
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pmysecretpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red-practica

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: "no"
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: mysecretpassword
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - red-practica

  app:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    restart: "no"
    ports:
      - "8888:8888"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - red-practica

  # Contenedor con nmap/hydra/sqlmap/cliente mysql -- las Etapas 3 y 4 lo usan para atacar
  # los demás servicios, así el alumno no necesita instalar ninguna de esas herramientas en
  # su propia máquina, solo Docker. Se queda corriendo en espera ("sleep infinity"); los
  # pasos de la práctica le mandan comandos con "docker compose exec toolbox <comando>".
  toolbox:
    build:
      context: ./toolbox
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    networks:
      - red-practica
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  red-practica:
